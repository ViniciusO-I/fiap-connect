<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Skill')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-4" style="max-width: 560px;">
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card shadow-sm">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">
                <i class="bi bi-lightning-fill"></i>
                <span th:text="${editMode} ? 'Editar Skill' : 'Nova Skill'">Skill</span>
            </h5>
        </div>
        <div class="card-body">

            <form th:action="${editMode} ? @{/skills/edit/{id}(id=${skill.id})} : @{/skills/new}"
                  th:object="${skill}" method="post">

                <div class="mb-3">
                    <label for="description" class="form-label fw-semibold">Descrição</label>
                    <input type="text" id="description" th:field="*{description}"
                           class="form-control"
                           th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                           placeholder="Ex: Java, Spring Boot, React..."/>
                    <div class="invalid-feedback"
                         th:if="${#fields.hasErrors('description')}"
                         th:errors="*{description}">Erro</div>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">
                        <i class="bi bi-check-lg"></i>
                        <span th:text="${editMode} ? 'Salvar alterações' : 'Criar skill'">Salvar</span>
                    </button>
                    <a th:href="@{/skills}" class="btn btn-outline-secondary">
                        <i class="bi bi-x-lg"></i> Cancelar
                    </a>
                </div>

            </form>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
