<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<!-- ═══════════════════════════════════════════════════════ HEAD ══ -->
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' | FIAP Connect'">FIAP Connect</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"/>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"/>
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
</head>

<!-- ═══════════════════════════════════════════════════════ NAVBAR ══ -->
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-danger">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-diagram-3-fill me-1"></i> FIAP Connect
        </a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/skills}"
                       th:classappend="${activeMenu == 'skills'} ? ' active fw-bold'">
                        <i class="bi bi-lightning-fill"></i> Skills
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/groups}"
                       th:classappend="${activeMenu == 'groups'} ? ' active fw-bold'">
                        <i class="bi bi-people-fill"></i> Grupos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link"
                       th:href="@{/users}"
                       th:classappend="${activeMenu == 'users'} ? ' active fw-bold'">
                        <i class="bi bi-person-lines-fill"></i> Usuários
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-2">
                    <a class="nav-link" th:href="@{/users/profile}">
                        <img th:src="${urlAvatar}" th:if="${urlAvatar}"
                             class="rounded-circle me-1" width="28" height="28" alt="avatar"/>
                        <span th:text="${username}">Usuário</span>
                    </a>
                </li>
                <li class="nav-item">
                    <form th:action="@{/logout}" method="post">
                        <button type="submit" class="btn btn-outline-light btn-sm">
                            <i class="bi bi-box-arrow-right"></i> Sair
                        </button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- ═══════════════════════════════════════════════════════ ALERTS ══ -->
<div th:fragment="alerts">
    <div th:if="${successMessage}"
         class="alert alert-success alert-dismissible fade show" role="alert">
        <i class="bi bi-check-circle-fill me-1"></i>
        <span th:text="${successMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${errorMessage}"
         class="alert alert-danger alert-dismissible fade show" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-1"></i>
        <span th:text="${errorMessage}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<!-- ═══════════════════════════════════════════════════════ SCRIPTS ══ -->
<div th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</div>

</html>
