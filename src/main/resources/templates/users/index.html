<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Usuários')}"></head>
<body class="bg-light">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="container py-4">
    <div th:replace="~{fragments :: alerts}"></div>

    <h2 class="mb-4">
        <i class="bi bi-person-lines-fill text-success"></i> Usuários Cadastrados
    </h2>

    <div th:if="${#lists.isEmpty(users)}" class="alert alert-info">
        Nenhum usuário cadastrado.
    </div>

    <div class="row g-3" th:if="${not #lists.isEmpty(users)}">
        <div class="col-md-6 col-lg-4" th:each="user : ${users}">
            <div class="card h-100 shadow-sm border-0">
                <div class="card-body">
                    <h6 class="fw-bold" th:text="${user.name}">Nome</h6>
                    <p class="text-muted small mb-2" th:text="${user.email}">email</p>
                    <span class="badge mb-2"
                          th:classappend="${user.profile.name() == 'ADMINISTRATOR'} ? 'bg-danger' : 'bg-secondary'"
                          th:text="${user.profile}">Perfil</span>

                    <div th:if="${not #lists.isEmpty(user.skills)}">
                        <p class="text-muted small mb-1">Skills:</p>
                        <span th:each="skill : ${user.skills}"
                              class="badge bg-warning text-dark me-1"
                              th:text="${skill.description}"></span>
                    </div>
                    <div th:if="${#lists.isEmpty(user.skills)}">
                        <span class="text-muted fst-italic small">Sem skills cadastradas</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: scripts}"></div>
</body>
</html>
