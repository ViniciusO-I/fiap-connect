spring.application.name=fiap-connect

# ─── Banco de dados H2 (in-memory para dev) ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:fiapconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── MVC (necessário para POST com _method=delete) ────────────────────────────
spring.mvc.hiddenmethod.filter.enabled=true

# ─── OAuth2 GitHub ────────────────────────────────────────────────────────────
# Configure suas credenciais do GitHub OAuth App:
# https://github.com/settings/developers -> New OAuth App
# Homepage URL: http://localhost:8080
# Callback URL: http://localhost:8080/login/oauth2/code/github
spring.security.oauth2.client.registration.github.client-id=idcliente
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:gerar uma secret client}
spring.security.oauth2.client.registration.github.scope=read:user

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.br.com.fiap=DEBUG
