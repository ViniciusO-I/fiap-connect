spring.application.name=fiap-connect

# ─── Banco de dados H2 (in-memory para dev) ───────────────────────────────────
spring.datasource.url=jdbc:h2:mem:fiapconnectdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

# ─── JPA ──────────────────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ─── Flyway ───────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── MVC ──────────────────────────────────────────────────────────────────────
spring.mvc.hiddenmethod.filter.enabled=true

# ─── Porta dinâmica (Railway injeta $PORT) ────────────────────────────────────
server.port=${PORT:8080}

# ─── OAuth2 GitHub ────────────────────────────────────────────────────────────
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:idcliente}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:gerar uma secret client}
spring.security.oauth2.client.registration.github.scope=read:user

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.br.com.fiap=DEBUG
